name: Build & Test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    # Pinned to the same macOS version as build-and-test so image updates to
    # macos-latest can't silently change the SwiftLint toolchain.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install SwiftLint (if the runner image lacks it)
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: SwiftLint
        # Config in .swiftlint.yml. Warnings are annotated on the PR; only
        # error-severity rules fail the job.
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    name: Build and unit-test (macOS 26, Xcode 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          # The asset catalog uses SF Symbols template format 7.0, which requires
          # Xcode 26's actool — and Xcode 26 needs a macOS 26 host (on the macos-15
          # image its ibtool crashes against the older dyld caches). Matching the
          # runner image and toolchain mirrors the supported local setup.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          sw_vers

      - name: Ensure a shared "Latest" scheme exists
        run: |
          # The repo does not check in Latest.xcodeproj/xcshareddata/xcschemes/, and
          # xcodebuild cannot auto-create schemes. Generate a shared scheme that builds
          # the app and runs the "Latest Tests" unit-test bundle. This is a no-op once
          # a shared scheme is committed to the repo.
          if [ -f "Latest.xcodeproj/xcshareddata/xcschemes/Latest.xcscheme" ]; then
            echo "Shared scheme already present; using it."
          else
            echo "No shared scheme checked in; generating one."
            ruby -e "require 'xcodeproj'" 2>/dev/null \
              || gem install xcodeproj --no-document \
              || sudo gem install xcodeproj --no-document
            ruby <<'RUBY'
          require "xcodeproj"
          project_path = "Latest.xcodeproj"
          project = Xcodeproj::Project.open(project_path)
          app   = project.targets.find { |t| t.name == "Latest" }
          tests = project.targets.find { |t| t.name == "Latest Tests" }
          raise "Expected targets not found in #{project_path}" unless app && tests
          scheme = Xcodeproj::XCScheme.new
          scheme.add_build_target(app)
          scheme.set_launch_target(app)
          scheme.add_test_target(tests)
          scheme.save_as(project_path, "Latest", true)
          puts "Wrote shared scheme 'Latest' (build: Latest, test: Latest Tests)."
          RUBY
          fi
          xcodebuild -list -project Latest.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Latest.xcodeproj \
            -scheme "Latest" \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Latest.xcodeproj \
            -scheme "Latest" \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
