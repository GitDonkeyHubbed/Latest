# SwiftLint configuration. Run locally with `swiftlint` from the repo root
# (brew install swiftlint). CI runs the same in the "SwiftLint" job of
# .github/workflows/build.yml.
#
# Warnings are annotated on PRs but do not fail CI; errors do. The codebase is
# kept at zero warnings so new ones stand out. Rules run at their default
# severities; only the thresholds below are tuned to this codebase.

excluded:
  - Sparkle
  - Frameworks
  - Latest.xcodeproj
  - DerivedData
  - .build

line_length:
  warning: 150
  error: 500
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true
  # NSLocalizedString comments must stay single string literals so genstrings
  # can extract them for translators, so those lines cannot be wrapped.
  excluded_lines_patterns: ['NSLocalizedString\(']

file_length:
  # Code is documented densely; measure code, not commentary.
  ignore_comment_only_lines: true

nesting:
  # Codable models nest their payload types
  # (UpdateRepository.Entry.MinimumOS.Version) and their CodingKeys.
  type_level: 3
  ignore_coding_keys: true

type_body_length:
  warning: 350
  error: 600

cyclomatic_complexity:
  warning: 10
  error: 40

identifier_name:
  allowed_symbols: ["_"]
  min_length: 2
  excluded: [id, x, y, i, j]

reporter: "xcode"
